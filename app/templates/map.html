<!DOCTYPE html>

<html>

  <head>
    <title>MAP</title>
    <link rel='stylesheet' href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    

    <style>
      body {
        font-family: 'Manrope', sans-serif;
      }

    </style>
  </head>

  <nav>
    <div class="bg-[#7CA1A3] backdrop-blur-sm flex items-center justify-between h-20 px-6">
      <a class="flex items-center gap-2" href="/">
        <span class="text-white font-extrabold text-xl tracking-wide hidden sm:block">Tacos</span>
      </a>
      <div class="flex flex-row items-center gap-2">
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/">Home</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/profile/{{username}}">Profile</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/create">Create</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/game">Play</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/logout">Logout</a>
      </div>
    </div>
  </nav>

  <body class="">

    <div
        class="fixed inset-0 bg-cover bg-center opacity-70 -z-20"
        style="background-image: url('{{ url_for('static', filename='uploads/tacos3.jpg') }}');">
    </div>

    <div class="max-w-7xl mx-auto px-6 py-8">
  
      <div class="relative z-20 bg-white/90 backdrop-blur-sm border border-gray-200 rounded-3xl shadow-sm p-8 mb-6 overflow-visible">
        <div class="flex flex-col items-center text-center">
          <h1 class="text-4xl font-extrabold text-gray-800">
            Recipe Map
          </h1>
      
          <p class="text-gray-500 mt-2 mb-4">
            See recipes' origins...
          </p>
        </div>
      
        <img
          src="/static/uploads/taco.gif"
          class="taco-walk absolute -bottom-10 right-10 z-30 w-80 h-auto pointer-events-none">
      
      </div>
  
      <div class="relative z-10 bg-white border border-gray-200 rounded-3xl shadow-sm p-4">
  
        <div
          id="map"
          class="w-full h-[650px] rounded-2xl overflow-hidden border border-gray-200">
        </div>
  
      </div>
  
    </div>
  
    <script>
  
      const bounds = [
        [-85, -180],
        [85, 180]
      ];

      const map = L.map('map', {
        maxBounds: bounds,
        maxBoundsViscosity: 1.0,
        minZoom: 2
      }).setView([20, 0], 2);
  
      L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
          attribution: '© OpenStreetMap',
          noWrap: true
        }
      ).addTo(map);
  
      const recipes = {{ recipes|tojson }};
  
      recipes.forEach(r => {
  
        if (r[3] && r[4]) {
  
          const icon = L.divIcon({
            className: "custom-icon",
            html: `
              <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-white shadow-lg">
                <img
                  src="/static/uploads/${r[2]}"
                  class="w-full h-full object-cover">
              </div>
            `,
            iconSize: [48, 48],
            iconAnchor: [24, 24]
          });
  
          const marker = L.marker(
            [r[3], r[4]],
            { icon: icon }
          ).addTo(map);
  
          marker.bindPopup(`
          <div class="w-[220px] p-1">

            <img
              src="/static/uploads/${r[2]}"
              class="w-full h-32 object-cover rounded-xl mb-3">

            <h3 class="text-lg font-bold text-gray-800 mb-2">
              ${r[1]}
            </h3>

            <a
              href="/recipe/${r[0]}"
              class="inline-flex items-center justify-center rounded-lg bg-[#7CA1A3] px-4 py-2 text-sm font-semibold text-white transition hover:brightness-95">
              View Recipe
            </a>

          </div>
        `, {
          minWidth: 240,
          maxWidth: 240
        });

          
  
        }
  
      });
  
    </script>
  
  </body>




  <footer>
    
  </footer>

</html>

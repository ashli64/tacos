<!DOCTYPE html>

<html>

  <head>
    <title>RECIPE</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  </head>

  <nav>
    <div class="bg-gray-800/95 backdrop-blur-sm flex items-center justify-between h-20 px-6">
      <a class="flex items-center gap-2" href="/">
        <span class="text-white font-extrabold text-xl tracking-wide hidden sm:block">Tacos</span>
      </a>
      <div class="flex flex-row items-center gap-2">
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/">Home</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/profile/{{username}}">Profile</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition"href='/create' class="util">Create</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition"href='/game' class="util">Play</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition"href='/map' class="util">Map</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/logout">Logout</a>
      </div>
    </div>
  </nav>

  <body>
    <br>
      <h1 class="text-3xl font-bold text-gray-800 mb-6">{{ name }} </h1>
      <div class="author">
        <a href="/profile/{{author}}" class="text-xl font-bold text-gray-800 mt-3">By: {{author}}</a>

      </div>

        <div class="w-40 h-40 overflow-hidden rounded-xl">
          <img
            src="{{ url_for('static', filename='uploads/' + pic) }}"
            alt="food img"
            class="w-full h-full object-cover"
          >
        </div>
        <br>

        <di>
          <h2 class="content text-3xl font-bold text-gray-800 mb-6"> Description: </h2>
          {{ description }}
        </div>
        <br><br>

        <div class="ingredients">
          <h2 class="text-3xl font-bold text-gray-800 mb-6">Ingredients:</h2>
          {{ ingredients }}
        </div>
        <br>

	      <div class="content">
          <h2 class="text-3xl font-bold text-gray-800 mb-6">Instructions:</h2>
          {{ instructions }}
        </div>

        <br>

        <div class="content">
          <h2 class="text-3xl font-bold text-gray-800 mb-6"> Skill level necessary: </h2>
          {{ difficulty }}
        </div>


    </div>
  </body>


</html>

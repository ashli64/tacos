<html>
<head>
    <title>HOME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>

</head>

<body>
<!--NAV BAR-->
    <nav>
      <div class="bg-gray-800/95 backdrop-blur-sm flex items-center justify-between h-20 px-6">
        <a class="flex items-center gap-2" href="/">
          <span class="text-white font-extrabold text-xl tracking-wide hidden sm:block">Tacos</span>
        </a>
        <div class="flex flex-row items-center gap-2">
          <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/">Home</a>
          <a class="font-semibold rounded-xl bg-white text-gray-800 py-2 px-4 text-sm" href="/profile/{{username}}">Profile</a>
          <a href='/create/{{new}}' class="util">Create</a>
          <a href='/game'>Game</a>
          <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/logout">Logout</a>
        </div>
      </div>
    </nav>

<div class="container text-center mt-5">
  <h1 class="fw-bold text-9x1">Welcome to Tacos: A Recipe Search & Share Tool</h1>
</div>

<div class="container text-center mt-5">
  <h1 class="fw-bold display-4">Explore our library of recipes or search for a specific recipe based off of it's name below:</h1>
</div>

<!-- the search  bar that shows everything if blank and limits search -->

<h1>Recipe Catalog</h1>

<form action="/results" method="GET" class="search-box">
    <input type="text" name="search" placeholder="Search recipe name" class="w-1/2 px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent transition">
    <button type="submit" class="w-1/3 font-bold bg-gray-800 rounded-xl text-white hover:bg-gray-700 py-3 mt-2 transition cursor-pointer text-sm uppercase tracking-widest">Search</button>
</form>

<div class="grid">
    {% for recipe in recipes %}
    <div class="card">
        <h3>{{ recipe[1] }}</h3>
        <p>{{ recipe[3] }}</p>
        <a href="/recipe/{{ recipe[0] }}">Open</a>
    </div>
    {% endfor %}
</div>

</body>
</html>

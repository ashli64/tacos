<html>
<head>
    <title>HOME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>

<body>
<!--NAV BAR-->
    <nav>
      <div class="bg-gray-800/95 backdrop-blur-sm flex items-center justify-between h-20 px-6">
        <a class="flex items-center gap-2" href="/">
          <span class="text-white font-extrabold text-xl tracking-wide hidden sm:block">Tacos</span>
        </a>
        <div class="flex flex-row items-center gap-2">
          <a class="font-semibold rounded-xl bg-white text-gray-800 py-2 px-4 text-sm" href="/">Home</a>
          <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/profile">Profile</a>
          <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href='/create/{{new}}' class="util">Create</a>
          <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/logout">Logout</a>
        </div>
      </div>
    </nav>

<div class="container text-center mt-5">
  <h1 class="fw-bold display-4">Welcome to Tacos</h1>
</div>

<ul>
{% for r in recipes %}
  <li>
    <a href="recipe/{{ recipes.index(r) }}">{{r[0]}}</a>
  </li>
{% endfor %}
</ul>

</body>
</html>

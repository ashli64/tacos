<!DOCTYPE html>

<html>

  <head>
    <title>HOME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
  </head>

  <nav>
    <div class="bg-gray-800/95 backdrop-blur-sm flex items-center justify-between h-20 px-6">
      <a class="flex items-center gap-2" href="/">
        <span class="text-white font-extrabold text-xl tracking-wide hidden sm:block">Tacos</span>
      </a>
      <div class="flex flex-row items-center gap-2">
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/">Home</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/profile">Profile</a>
        <a class="font-semibold rounded-xl bg-white text-gray-800 py-2 px-4 text-sm" href='/create/{{new}}' class="util">Create</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/logout">Logout</a>
      </div>
    </div>
  </nav>

  <body>
    <br>
    <div class='main'>
      <form method="POST" action="">
          <p>Title:</p>
          <input class="w-1/2 px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent transition" type="text" name="name" placeholder="Recipe Name:" required>
          <br><br>
          <p>Description:</p>
          <textarea class="h-auto w-3/4 px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent transition" name="description" rows="40" cols="100" placeholder="Enter food description..." required></textarea>
          <br>
          <p>Ingredients:</p>
          <textarea class="w-3/4 px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent transition" name="ingredients" rows="5" cols="100" placeholder="Enter ingredients..." required></textarea>
          <br>
        <input class="mt-8 w-1/2 font-bold bg-gray-800 rounded-xl text-white hover:bg-gray-700 py-3 transition cursor-pointer text-sm uppercase tracking-widest" type="submit" id='submit' value="Publish Recipe">
      </form>
    </div>
  </body>

  <footer>

  </footer>

</html>

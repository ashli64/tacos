<!DOCTYPE html>

<html>

  <head>
    <title>HOME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>

  <nav>
    <div class="bg-gray-800/95 backdrop-blur-sm flex items-center justify-between h-20 px-6">
      <a class="flex items-center gap-2" href="/">
        <span class="text-white font-extrabold text-xl tracking-wide hidden sm:block">Tacos</span>
      </a>
      <div class="flex flex-row items-center gap-2">
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/">Home</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/profile/{{username}}">Profile</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/create">Create</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/game">Play</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/map">Map</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/logout">Logout</a>
      </div>
    </div>
  </nav>

  <body class="min-h-screen bg-gray-100">
    <br>
    <div class='main'>
      <form method="POST" action="/searchIngs" enctype="multipart/form-data">

          <p class="text-3xl font-bold text-gray-800 mb-6">Ingredients:</p>
          <ul id="ingredientList" class="list-disc list-inside bg-white p-3 rounded w-1/2 min-h-12 border">
            {% for ing in ings %}
              <li>{{ ing }}</li>
            {% endfor %}
          </ul>
          <br>
          <input type="hidden" name="ingredients" id="ingredientsHidden">
          <input placeholder="type and add one at a time" class="w-1/2 px-4 py-3 rounded-xl border border-gray-200 bg-white text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent transition" type = "text" id = "inp" pattern="[^,]*" value="">


          <button type="button" onclick="newF()" class="inline-block font-semibold bg-gray-800 text-white text-sm rounded-xl px-4 py-2 hover:bg-gray-700 transition">
            Add Ingredient
          </button>
          <br>

        <input class="w-1/3 font-bold bg-gray-800 rounded-xl text-white hover:bg-gray-700 py-3 mt-2 transition cursor-pointer text-sm uppercase tracking-widest" type="submit" id='submit' value="Search">

      </form>

<br>

      <h1 class="text-3xl font-bold text-gray-800 mb-6">Results:</h1>

        <div class="grid">
            {% for recipe in stuff %}
                <div class="card w-1/2 bg-white rounded-2xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition">
                    <h3 class="font-bold text-gray-800 text-lg mb-1">{{ recipe[1] }}</h3>
                    <p class="text-gray-500 text-sm mb-4 line-clamp-2">{{ recipe[3] }}</p>
                    <p><a href="/recipe/{{ recipe[0] }}" class="inline-block font-semibold bg-gray-800 text-white text-sm rounded-xl px-4 py-2 hover:bg-gray-700 transition">Open</a></p>
                </div>
                <br>
            {% endfor %}
        </div>

        {% if stuff|length == 0 %}
            <p>No Results</p>
        {% endif %}

      <script>
        let ingredients = [];

        function newF() {
            const input = document.getElementById("inp");
            const value = input.value.trim();

            if (value === "") return;

            ingredients.push(value);

            const li = document.createElement("li");
            li.textContent = value;
            document.getElementById("ingredientList").appendChild(li);

            document.getElementById("ingredientsHidden").value =
                ingredients.join(",");

            input.value = "";
        }
      </script>





    </div>
  </body>

  <footer>

  </footer>

</html>

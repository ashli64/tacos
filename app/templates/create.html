<!DOCTYPE html>

<html>

  <head>
    <title>HOME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>

  <nav>
    <div class="bg-gray-800/95 backdrop-blur-sm flex items-center justify-between h-20 px-6">
      <a class="flex items-center gap-2" href="/">
        <span class="text-white font-extrabold text-xl tracking-wide hidden sm:block">Tacos</span>
      </a>
      <div class="flex flex-row items-center gap-2">
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/">Home</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/profile/{{username}}">Profile</a>
        <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/logout">Logout</a>
      </div>
    </div>
  </nav>

  <body>
    <br>
    <div class='main'>
      <form method="POST" action="" enctype="multipart/form-data">
          <p>Title:</p>
          <textarea name="name" placeholder="Recipe Name:" required></textarea>
          <br><br>
          <p>Description:</p>
          <textarea name="description" rows="5" cols="100" placeholder="Enter food description..." required></textarea>
          <br>

          <p>Ingredients (don't include commas):</p>
          <ul id="ingredientList" class="list-disc list-inside bg-gray-50 p-3 rounded w-1/2 min-h-12 border">
            {% for ing in ings %}
              <li>{{ ing }}</li>
            {% endfor %}
          </ul>
          <input type="hidden" name="ingredients" id="ingredientsHidden">
          <input type = "text" id = "inp" name = "addIng" pattern="[^,]*" value="">
          <button type="button" onclick="newF()">
            Add Ingredient
          </button>

          <br><br>
          <p>Instructions:</p>
          <textarea class="w-1/2 px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent transition" name="instructions" rows="10" cols="100" placeholder="Enter instructions..." required></textarea>
          <br><br>
          
          <label for= "pic">Pick a photo:</label> 
          <input name = "pic" id = "pic" type="file" accept="image/*" capture="environment">
          
          <br><br>

          <p>Skill Level Required:</p>

          <fieldset>
            <input type="radio" name="diff" value="Hopeless in kitchen" required> Hopeless in kitchen<br>
            <input type="radio" name="diff" value="Beginner"> Beginner<br>
            <input type="radio" name="diff" value="Mediocre"> Mediocre<br>
            <input type="radio" name="diff" value="Good"> Good<br>
            <input type="radio" name="diff" value="Advanced"> Advanced<br>
          </fieldset>

        <br>

        <div id="map" style="height: 300px;"></div>

        <input type="hidden" name="lt" id="lt">
        <input type="hidden" name="lg" id="lg">

        <br>

        <input class="w-1/3 font-bold bg-gray-800 rounded-xl text-white hover:bg-gray-700 py-3 mt-2 transition cursor-pointer text-sm uppercase tracking-widest" type="submit" id='submit' value="Publish Recipe">

      </form>

      <script>
        let ingredients = [];
        const mp = L.map('map', {
          minZoom: 2,
          maxZoom: 18
        }).setView([20, 0], 2);
        let mark = null;

    
        function newF() {
            const input = document.getElementById("inp");
            const value = input.value.trim();
    
            if (value === "") return;
    
            ingredients.push(value);
    
            const li = document.createElement("li");
            li.textContent = value;
            document.getElementById("ingredientList").appendChild(li);
    
            document.getElementById("ingredientsHidden").value =
                ingredients.join(",");
    
            input.value = "";
        }

        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            noWrap: true
        }).addTo(mp);
        mp.on('click', function(evt) {
        const lat = evt.latlng.lat;
        const lng = evt.latlng.lng;

        document.getElementById("lt").value = lat;
        document.getElementById("lg").value = lng;

        if (mark) {
            mp.removeLayer(mark);
        }

        mark = L.marker([lat, lng]).addTo(mp);
        });

      </script>




    </div>
  </body>

  <footer>

  </footer>

</html>
